<!-- BACKUP: GALERIA DE ASSETS DO MESTRE (MesaLibrary & master-assets-sidebar) -->
<!-- Estrutura HTML, Estilos CSS e Logica JavaScript completa para restauracao futura -->

<!-- 1. ESTRUTURA HTML -->
<!-- SIDEBAR LATERAL ESQUERDA: GALERIA DE ASSETS DO MESTRE (ESTILO TECNICO DESKRPG) -->
<div id="master-assets-sidebar" class="master-assets-sidebar">
  <div class="sidebar-topbar">
    <div class="sidebar-title-group">
      <span class="sidebar-title">ADMINISTRADOR DE ASSETS</span>
      <span class="sidebar-subtitle">Galeria de Imagens</span>
    </div>
    <button class="sidebar-close-btn" onclick="MesaLibrary.toggleSidebar()" title="Fechar">&times;</button>
  </div>

  <!-- Barra de Status da Projecao Central -->
  <div class="adm-projection-status-bar sidebar-status">
    <div class="adm-proj-info">
      <span class="adm-proj-label">CENTRO:</span>
      <span id="adm-active-proj-name" class="adm-proj-name">NENHUM</span>
    </div>
    <button id="adm-btn-clear-proj" class="adm-col-action-btn danger" onclick="MesaLibrary.clearCenterProjection()" style="display:none;">Desativar</button>
  </div>

  <!-- Pastas de Categorias -->
  <div class="sidebar-section-header">
    <span>PASTAS & CATEGORIAS</span>
    <button class="sidebar-action-btn" onclick="MesaLibrary.promptNewFolder()">+ Nova Pasta</button>
  </div>
  <div id="adm-folder-list" class="sidebar-folder-list">
    <!-- Renderizado via JS -->
  </div>

  <!-- Acoes de Adicao na Pasta -->
  <div class="sidebar-section-header" style="margin-top: 14px;">
    <span id="adm-selected-folder-title">PERSONAGENS / NPCS</span>
    <button class="sidebar-action-btn" onclick="document.getElementById('adm-library-file-input').click()">+ Arquivo</button>
    <input type="file" id="adm-library-file-input" accept="image/*" multiple style="display:none;" onchange="MesaLibrary.handleLocalUpload(event)">
  </div>

  <div class="sidebar-url-bar">
    <input type="text" id="adm-library-url-input" placeholder="Cole link da imagem (.png, .jpg, web)..." class="sidebar-input">
    <input type="text" id="adm-library-name-input" placeholder="Nome..." class="sidebar-input name-input">
    <button class="sidebar-action-btn" onclick="MesaLibrary.addFromUrlInput()">+ Link</button>
  </div>

  <!-- Grade de Imagens da Pasta Selecionada -->
  <div id="adm-folder-items-grid" class="sidebar-gallery-grid">
    <!-- Cards renderizados via JS -->
  </div>
</div>

<!-- Projecao Central de Imagens do Mestre (No centro do quadro preto) -->
<div id="board-center-display" class="board-center-display">
  <div id="board-center-content" class="board-center-content glitch-portrait-box">
    <canvas id="board-center-glitch-canvas" class="board-center-glitch-canvas portrait-glitch-canvas"></canvas>
    <img id="board-center-img" class="board-center-img glitch-img-base" src="" alt="Projecao Central" style="display:none;" />
    <img id="board-center-glitch-1" class="board-center-img glitch-img-layer glitch-layer-1" src="" alt="" aria-hidden="true" style="display:none;" />
    <img id="board-center-glitch-2" class="board-center-img glitch-img-layer glitch-layer-2" src="" alt="" aria-hidden="true" style="display:none;" />
    <button id="board-center-close-btn" class="board-center-close-btn" style="display:none;" onclick="MesaLibrary.clearCenterProjection()" title="Remover Projecao">&times;</button>
  </div>
</div>

<!-- 2. JAVASCRIPT: LOGICA DO MesaLibrary -->
<script>
const MesaLibrary = {
  STORAGE_KEY: 'mesa_master_folders_v1',
  PROJ_STORAGE_KEY: 'mesa_master_active_proj_v1',
  
  folders: [
    {
      id: 'npcs',
      name: 'Personagens / NPCs',
      icon: '[NPCs]',
      items: [
        {
          id: 'item-thulita',
          title: 'Thulita De La Benevidez',
          url: 'assets/thulita.png',
          thumb: 'assets/thulita_avatar.png',
          created_at: new Date().toISOString()
        }
      ]
    },
    {
      id: 'itens',
      name: 'Itens & Artefatos',
      icon: '[ITENS]',
      items: []
    },
    {
      id: 'cenarios',
      name: 'Cenarios & Locais',
      icon: '[CENARIOS]',
      items: []
    },
    {
      id: 'pistas',
      name: 'Pistas & Documentos',
      icon: '[PISTAS]',
      items: []
    }
  ],

  currentFolderId: 'npcs',
  activeProjection: null,
  isSidebarOpen: false,

  init() {
    this.loadFromStorage();
    this.renderFolders();
    this.renderGallery();
    this.updateProjectionBar();
    this.restoreProjection();
  },

  toggleSidebar(forceState) {
    if (!MesaApp.state.isMaster) return;
    const sidebar = document.getElementById('master-assets-sidebar');
    if (!sidebar) return;

    if (forceState !== undefined) {
      this.isSidebarOpen = forceState;
    } else {
      this.isSidebarOpen = !this.isSidebarOpen;
    }

    if (this.isSidebarOpen) {
      sidebar.classList.add('active');
    } else {
      sidebar.classList.remove('active');
    }
  },

  loadFromStorage() {
    try {
      const raw = localStorage.getItem(this.STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (Array.isArray(parsed) && parsed.length > 0) {
          this.folders = parsed;
        }
      }
    } catch (e) {
      console.warn("Falha ao carregar biblioteca do storage:", e);
    }
  },

  saveToStorage() {
    try {
      localStorage.setItem(this.STORAGE_KEY, JSON.stringify(this.folders));
    } catch (e) {
      console.warn("Falha ao salvar biblioteca no storage:", e);
    }
  },

  restoreProjection() {
    try {
      const raw = localStorage.getItem(this.PROJ_STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (parsed && parsed.isProjecting && parsed.url) {
          this.activeProjection = parsed;
          this.updateCenterDOM(parsed);
          this.updateProjectionBar();
        }
      }
    } catch (e) {}
  },

  saveActiveProjection(proj) {
    try {
      if (proj && proj.isProjecting) {
        localStorage.setItem(this.PROJ_STORAGE_KEY, JSON.stringify(proj));
      } else {
        localStorage.removeItem(this.PROJ_STORAGE_KEY);
      }
    } catch (e) {}
  },

  renderFolders() {
    const list = document.getElementById('adm-folder-list');
    if (!list) return;

    list.innerHTML = this.folders.map(folder => `
      <div class="adm-folder-item ${folder.id === this.currentFolderId ? 'active' : ''}" onclick="MesaLibrary.selectFolder('${folder.id}')">
        <div class="adm-folder-name" title="${folder.name}">
          <span style="font-size: 0.65rem; color: #a1a1aa; font-family: monospace;">${folder.icon || '[DIR]'}</span>
          <span>${folder.name}</span>
        </div>
        <span class="adm-folder-count">${folder.items ? folder.items.length : 0}</span>
      </div>
    `).join('');
  },

  selectFolder(id) {
    this.currentFolderId = id;
    this.renderFolders();
    this.renderGallery();
  },

  promptNewFolder() {
    const name = prompt("Nome da nova pasta/categoria (ex: 'Monstros', 'Mapas', 'Grimorio'):");
    if (!name || !name.trim()) return;

    const id = 'folder_' + Date.now();
    this.folders.push({
      id: id,
      name: name.trim(),
      icon: '[PASTA]',
      items: []
    });

    this.currentFolderId = id;
    this.saveToStorage();
    this.renderFolders();
    this.renderGallery();
  },

  renderGallery() {
    const folder = this.folders.find(f => f.id === this.currentFolderId) || this.folders[0];
    const titleEl = document.getElementById('adm-selected-folder-title');
    const grid = document.getElementById('adm-folder-items-grid');

    if (titleEl && folder) {
      titleEl.textContent = `${folder.name.toUpperCase()}`;
    }

    if (!grid) return;

    if (!folder || !folder.items || folder.items.length === 0) {
      grid.innerHTML = `<div class="adm-empty-note" style="grid-column: 1 / -1; padding: 20px; text-align: center; font-size: 0.72rem; color: #71717a;">Nenhuma imagem nesta pasta.</div>`;
      return;
    }

    grid.innerHTML = folder.items.map(item => {
      const isProjected = this.activeProjection && this.activeProjection.isProjecting && this.activeProjection.url === item.url;
      return `
        <div class="adm-gallery-card ${isProjected ? 'projected' : ''}" onclick="MesaLibrary.toggleCenterProjection('${item.id}')">
          <div class="adm-gallery-thumb-box">
            <img src="${item.thumb || item.url}" alt="${item.title}" class="adm-gallery-thumb" />
          </div>
          <div class="adm-gallery-card-title" title="${item.title}">${item.title}</div>
          <div class="adm-gallery-actions">
            <button class="adm-card-btn proj-btn" onclick="event.stopPropagation(); MesaLibrary.toggleCenterProjection('${item.id}')" title="Exibir / Remover do Centro">
              ${isProjected ? '[REMOVER]' : '[EXIBIR]'}
            </button>
            <button class="adm-card-btn danger" onclick="event.stopPropagation(); MesaLibrary.deleteItem('${folder.id}', '${item.id}')" title="Excluir">&times;</button>
          </div>
        </div>
      `;
    }).join('');
  },

  async handleLocalUpload(e) {
    const files = e.target.files;
    if (!files || files.length === 0) return;

    const folder = this.folders.find(f => f.id === this.currentFolderId);
    if (!folder) return;

    for (const file of Array.from(files)) {
      const dataUrl = await this.compressImage(file);
      if (!dataUrl) continue;

      const cleanName = file.name.replace(/\.[^/.]+$/, "").replace(/[-_]/g, " ");
      folder.items.push({
        id: 'img_' + Date.now() + '_' + Math.floor(Math.random() * 1000),
        title: cleanName,
        url: dataUrl,
        thumb: dataUrl,
        created_at: new Date().toISOString()
      });
    }

    this.saveToStorage();
    this.renderFolders();
    this.renderGallery();
    e.target.value = '';
  },

  compressImage(file) {
    return new Promise((resolve) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const maxDim = 1280;
          let width = img.width;
          let height = img.height;

          if (width > maxDim || height > maxDim) {
            if (width > height) {
              height = Math.round((height * maxDim) / width);
              width = maxDim;
            } else {
              width = Math.round((width * maxDim) / height);
              height = maxDim;
            }
          }

          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          resolve(canvas.toDataURL('image/jpeg', 0.82));
        };
        img.onerror = () => resolve(e.target.result);
        img.src = e.target.result;
      };
      reader.onerror = () => resolve(null);
      reader.readAsDataURL(file);
    });
  },

  addFromUrlInput() {
    const urlInput = document.getElementById('adm-library-url-input');
    const nameInput = document.getElementById('adm-library-name-input');
    if (!urlInput || !urlInput.value.trim()) return;

    const url = urlInput.value.trim();
    let title = nameInput ? nameInput.value.trim() : '';

    if (!title) {
      try {
        const u = new URL(url);
        title = u.pathname.split('/').pop().replace(/\.[^/.]+$/, "") || 'Ilustracao';
      } catch (e) {
        title = 'Ilustracao';
      }
    }

    const folder = this.folders.find(f => f.id === this.currentFolderId);
    if (!folder) return;

    folder.items.push({
      id: 'img_' + Date.now() + '_' + Math.floor(Math.random() * 1000),
      title: title,
      url: url,
      thumb: url,
      created_at: new Date().toISOString()
    });

    this.saveToStorage();
    this.renderFolders();
    this.renderGallery();

    urlInput.value = '';
    if (nameInput) nameInput.value = '';
  },

  deleteItem(folderId, itemId) {
    const folder = this.folders.find(f => f.id === folderId);
    if (!folder) return;

    const idx = folder.items.findIndex(i => i.id === itemId);
    if (idx !== -1) {
      const item = folder.items[idx];
      folder.items.splice(idx, 1);
      
      if (this.activeProjection && this.activeProjection.url === item.url) {
        this.clearCenterProjection();
      }

      this.saveToStorage();
      this.renderFolders();
      this.renderGallery();
    }
  },

  toggleCenterProjection(itemId) {
    const folder = this.folders.find(f => f.id === this.currentFolderId);
    if (!folder) return;
    const item = folder.items.find(i => i.id === itemId);
    if (!item) return;

    if (this.activeProjection && this.activeProjection.isProjecting && this.activeProjection.url === item.url) {
      this.clearCenterProjection();
    } else {
      this.projectToCenter(item);
    }
  },

  projectToCenter(item) {
    const payload = {
      isProjecting: true,
      url: item.url,
      title: item.title,
      id: item.id
    };

    this.activeProjection = payload;
    this.saveActiveProjection(payload);
    this.updateCenterDOM(payload);
    this.updateProjectionBar();
    this.renderGallery();

    if (MesaChat.channel) {
      MesaChat.channel.send({
        type: 'broadcast',
        event: 'board_display_sync',
        payload: payload
      });
    }
  },

  clearCenterProjection() {
    const payload = { isProjecting: false };
    this.activeProjection = null;
    this.saveActiveProjection(null);
    this.updateCenterDOM(payload);
    this.updateProjectionBar();
    this.renderGallery();

    if (MesaChat.channel) {
      MesaChat.channel.send({
        type: 'broadcast',
        event: 'board_display_sync',
        payload: payload
      });
    }
  },

  updateCenterDOM(data) {
    const display = document.getElementById('board-center-display');
    const img = document.getElementById('board-center-img');
    const glitch1 = document.getElementById('board-center-glitch-1');
    const glitch2 = document.getElementById('board-center-glitch-2');
    const closeBtn = document.getElementById('board-center-close-btn');

    if (!display || !img) return;

    if (data && data.isProjecting && data.url) {
      img.src = data.url;
      img.style.display = 'block';

      if (glitch1) {
        glitch1.src = data.url;
        glitch1.style.display = 'block';
      }
      if (glitch2) {
        glitch2.src = data.url;
        glitch2.style.display = 'block';
      }

      if (closeBtn) {
        closeBtn.style.display = MesaApp.state.isMaster ? 'flex' : 'none';
      }

      display.classList.remove('active');
      void display.offsetWidth;
      display.classList.add('active');

      setTimeout(() => {
        if (typeof BoardCenterGlitchEngine !== 'undefined') BoardCenterGlitchEngine.start();
      }, 25);
    } else {
      img.src = '';
      img.style.display = 'none';
      if (glitch1) { glitch1.src = ''; glitch1.style.display = 'none'; }
      if (glitch2) { glitch2.src = ''; glitch2.style.display = 'none'; }
      if (closeBtn) closeBtn.style.display = 'none';
      display.classList.remove('active');
      if (typeof BoardCenterGlitchEngine !== 'undefined') BoardCenterGlitchEngine.stop();
    }
  },

  updateProjectionBar() {
    const nameEl = document.getElementById('adm-active-proj-name');
    const clearBtn = document.getElementById('adm-btn-clear-proj');

    if (this.activeProjection && this.activeProjection.isProjecting) {
      if (nameEl) nameEl.textContent = (this.activeProjection.title || 'ATIVO').toUpperCase();
      if (clearBtn) clearBtn.style.display = 'inline-flex';
    } else {
      if (nameEl) nameEl.textContent = 'NENHUM';
      if (clearBtn) clearBtn.style.display = 'none';
    }
  },

  handleIncomingBoardDisplay(data) {
    this.activeProjection = data && data.isProjecting ? data : null;
    this.updateCenterDOM(data);
    this.updateProjectionBar();
    if (MesaApp.state.isMaster) {
      this.renderGallery();
    }
  }
};
</script>
