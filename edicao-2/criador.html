<!-- SUPABASE CLIENT E SCRIPTS DO MOTOR E DA INTERFACE 2.0 -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/engine/sheet-model.js"></script>
<script src="js/engine/rules-registry.js"></script>
<script src="js/engine/calculation-engine.js"></script>
<script src="js/engine/auth-token.js"></script>
<script src="js/engine/sheet-storage.js"></script>
<script src="js/ui/dynamic-trackers.js"></script>
<script src="js/ui/creator-wizard.js"></script>

<script>
  document.addEventListener("DOMContentLoaded", () => {
    // 1. Monta a Barra de Autenticacao Unificada por Token
    WuAuthToken.mountAuthBar("auth-bar-mount", (authData) => {
      if (authData && authData.valid && authData.playerName) {
        if (!WuCreatorWizard.charData.meta.player) {
          WuCreatorWizard.charData.meta.player = authData.playerName;
          const playerInput = document.getElementById("input-char-player");
          if (playerInput) playerInput.value = authData.playerName;
        }
      }
    });

    // 2. Inicializa o Assistente de Criacao
    WuCreatorWizard.init("wizard-mount-point");
  });
</script>
