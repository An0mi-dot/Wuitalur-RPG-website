<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="0; url=./Pag_Principal/html/index.html">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wuitalur RPG - Redirecionamento</title>
    <link rel="icon" href="Historia/Imagens/Site_Icone.png" type="image/png">
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .redirect-message {
            background: rgba(255, 255, 255, 0.1);
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="redirect-message">
        <h1>🎲 Wuitalur RPG</h1>
        <div class="loading"></div>
        <p>Redirecionando para o site principal...</p>
        <p><a href="./Pag_Principal/html/index.html" style="color: #64ffda; text-decoration: none;">Clique aqui se não for redirecionado automaticamente</a></p>
        <p style="font-size: 0.8em; opacity: 0.7; margin-top: 15px; color: #b8a1d9;">
            Alpha 1.0.0 - 28/10/2025
        </p>
    </div>
</body>
</html>
