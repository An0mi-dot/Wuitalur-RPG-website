<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DeskRPG — Mesa Digital</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/desk-rpg.css">
</head>
<body>

  <div class="battle-row">

    <div class="content-wrap">

      <div class="turn-banner" id="turn-banner">

        <span class="turn-active-name" id="turn-active">-</span>

      <div class="party-bar" id="party-bar"></div>

    </div>

    <div class="turn-card" id="turn-card"></div>

  </div>

  <div class="desk-badge">DESKRPG // TESTE VISUAL</div>

  <script src="js/uiRenderer.js"></script>
