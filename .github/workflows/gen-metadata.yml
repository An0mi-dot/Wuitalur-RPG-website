name: Generate site metadata

on:
  push:
    branches: [ main ]

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Generate metadata files
        run: |
          node .github/scripts/generate-metadata.js

      - name: Commit metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json updates.json || true
          if ! git diff --cached --quiet; then
            git commit -m "ci: update site metadata (version/updates)"
            git push origin HEAD:${{ github.ref }}
          else
            echo "No metadata changes"
          fi
